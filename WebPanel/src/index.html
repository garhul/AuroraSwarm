<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>AuroraSwarm WebPanel</title>
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid p-2">
      <span id="connectedBadge" class="badge bg-secondary">Disconnected</span>
      <button type="button" id="connectBtn" class="btn btn-outline-light">Connect</button>
    </div>
  </nav>

  <div class="container">

    <!-- Controls widget -->
    <div class="row mt-2 justify-content-between">
      <div class="col-md-8 position-relative" id="Controls">
        <div class="row">
          <h5>Controls</h5>
        </div>

        <div class="row">
          <h6>Color swatch</h6>
          <div class="col-12" id="ColorSwatches">
            color whesel here
          </div>
        </div>

        <div class="row mt-4">
          <fieldset>
            <label for="brRange" class="form-label">Brightness</label>
            <input id="brRange" class="form-range" type="range" min="0" max="255" />
          </fieldset>

        </div>

        <div class="row mt-4 mb-4">
          <div class="row mb-2 justify-content-between">
            <div class="col-6">
              <h6>Animations</h6>
            </div>
            <div class="col-6 text-end">
              <button data-payload="H:play" class="btn btn-sm btn-outline-success">Animation Play</button>
              <button data-payload="H:pause" class="btn btn-sm btn-outline-secondary">Animation Pause</button>
              <button data-payload="H:off" class="btn btn-sm btn-outline-danger">Off</button>
            </div>
          </div>

          <div class="col">
            <!-- 
            RAINBOW, // changes hue on all leds 
            WAVEBOW, //  changes hue from center to edges and bounces back, uses two colors as inputs
            AURORA, // simulates aurora effect
            OPPOSITES, // sets opposite sides of the strip to complementary hues and rotates them inwards or outwards
            LIGHTNING, // flashes the strip white for a single frame emulating lightning storms
            CHASER, // a single bright pixel that chases around the strip
            POLICE, // two pixels of complementary hues chase around the strip
            ALBICELESTE, // celeste y blanca-->
            <fieldset class="mt-2">
              <label for=" spdRange" class="form-label">Animation Speed</label>
              <input id="spdRange" class="form-range" type="range" min="0" max="255" />
            </fieldset>
            <div class="mt-2">
              <button data-payload='{"cmds":["H:FX:1","H:play"]}' data-type="json"
                class="btn btn-sm btn-warning">Rainbow</button>
              <button data-payload="H:FX:2" class="btn btn-sm btn-warning">Wave Bow</button>
              <button data-payload="H:FX:3" class="btn btn-sm btn-warning">Aurora</button>
              <button data-payload="H:FX:4" class="btn btn-sm btn-warning">Oposites</button>
              <button data-payload="H:FX:5" class="btn btn-sm btn-warning">Lightning</button>
              <button data-payload="H:FX:6" class="btn btn-sm btn-warning">Chaser</button>
              <button data-payload="H:FX:7" class="btn btn-sm btn-warning">Police</button>
              <button data-payload="H:FX:8" class="btn btn-sm btn-warning">Albiceleste</button>
            </div>
          </div>
        </div>

        <div class="row mt-4">
          <div class="col-12">
            <span id="SelectedNodesBadge"
              class="m-1 position-absolute bottom-0 end-0 badge text-bg-success badge-outline"></span>
          </div>
        </div>
      </div>

      <!-- nodes list widget -->
      <div class="col-md-3" id="NodeList">
        <!-- <div class="h-100 w-100 d-inline-block"> -->
        <h5>Nodes list</h5>
        <div class="row">
          <ul>
            <li>

            </li>
          </ul>
        </div>
        <div class="row justify-content-end">
          <div class="col-auto align-self-end p-2">
            <button id="autoUpdateToggleBtn" type="button" class="btn btn-secondary btn-xs"><span
                class="btnIndicator indicator-on"></span>Auto Update</button>
          </div>
        </div>
      </div>
    </div>

    <!-- terminal widget -->
    <div class="row mt-4" id="TermWidget">
      <div class="col-12">
        <div class="row justify-content-between mt-2 mb-2">
          <div class="col-4">
            <h5>Terminal</h5>
          </div>
          <div class="col-auto align-self-end p-2">
            <div class="btn-group align-self-end" role="group">
              <button id="autoScrollToggleBtn" type="button" class="btn btn-secondary btn-xs"><span
                  class="btnIndicator indicator-on"></span>Autoscroll</button>
              <button id="clearBtn" type="button" class="btn btn-secondary btn-xs">Clear</button>
            </div>
          </div>
        </div>
        <div class="viewPort w-100 d-inline-block"></div>
        <!-- <div class="input-group mb-3">
          <input id="cmdInput" type="text" class="form-control form-control-sm" placeholder="command input"
            aria-label="Send commands" aria-describedby="input_grp" />
          <div class="input-group-append">
            <button id="#sendBtn" class="btn btn-sm btn-warning" type="button">send</button>
          </div>
        </div> -->
      </div>
    </div>
  </div>
  </div>
</body>

</html>
